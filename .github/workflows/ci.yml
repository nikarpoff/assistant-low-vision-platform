name: ci

on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install moq
        run: |
          go install github.com/matryer/moq@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate mocks
        run: go generate ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -p 1 ./...
