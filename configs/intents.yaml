# Фразы команд (PLT-4). Ключ - намерение, значение - его фразы.
#
# Расшифровка и фразы нормализуются одинаково: нижний регистр, «ё» → «е»,
# знаки препинания заменяются пробелом, пробелы схлопываются. Команда
# распознаётся, если нормализованная расшифровка равна фразе, в том числе
# с «пожалуйста» в начале или в конце. Любой другой непустой текст -
# намерение question.
#
# Намерения: describe, describe_ahead, repeat, stop, passive_on, passive_off.
# Одна фраза не может принадлежать двум намерениям. Файл подменяется
# переменной APP_INTENTS_PATH, его хеш входит в config_id.

describe:
  - опиши
  - опиши обстановку
  - что вокруг
  - что ты видишь
  - что видишь
  - осмотрись

describe_ahead:
  - что впереди
  - что передо мной
  - что спереди

repeat:
  - повтори
  - еще раз
  - не расслышал
  - не понял
  - что ты сказал

stop:
  - стоп
  - хватит
  - замолчи
  - тихо

passive_on:
  - включи пассивный режим
  - следи за дорогой
  - предупреждай об опасности

passive_off:
  - выключи пассивный режим
  - не следи
  - перестань следить
